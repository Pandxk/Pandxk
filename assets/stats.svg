<svg width="495" height="215" viewBox="0 0 495 215" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId">
  <title id="titleId">Telemetría Cósmica de Andres (Pandxk)</title>
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050411"/>
      <stop offset="55%" stop-color="#0a061c"/>
      <stop offset="100%" stop-color="#040917"/>
    </linearGradient>
    <linearGradient id="sBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="rankAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb8500" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#f72585" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050411" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rankRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .header { font: 700 17px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .sub { font: 600 10.5px 'Cascadia Code', 'Fira Code', ui-monospace, monospace; fill: #c77dff; letter-spacing: 1px; }
      .stat { font: 600 13.5px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #cbd5e1; }
      .bold { font: 700 14px 'Cascadia Code', 'Fira Code', ui-monospace, monospace; fill: #38bdf8; }
      .bold-amber { font: 700 14px 'Cascadia Code', 'Fira Code', ui-monospace, monospace; fill: #ffb703; }
      .rank-text { font: 800 26px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #fff8e7; }
      .rank-sub { font: 700 10px 'Cascadia Code', 'Fira Code', ui-monospace, monospace; fill: #ffb703; letter-spacing: 1.2px; }
      .icon { fill: #c77dff; }
      .spin-ring { animation: spinRing 12s linear infinite; }
      @keyframes spinRing { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -276; } }
    </style>
  </defs>

  <rect x="1" y="1" rx="14" height="213" width="493" fill="url(#sBg)" stroke="url(#sBorder)" stroke-width="1.5"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="445" cy="24" r="1.2"/><circle cx="310" cy="30" r="1"/><circle cx="468" cy="182" r="1.1"/>
    <circle cx="292" cy="192" r="1"/><circle cx="28" cy="194" r="1.2"/>
  </g>

  <g transform="translate(24, 30)">
    <text x="0" y="0" class="sub">TELEMETRÍA CÓSMICA</text>
    <text x="0" y="22" class="header">Andres (Pandxk) — GitHub Stats</text>
  </g>

  <g transform="translate(24, 68)">
    <!-- Row 1: Total Contributions 2026 -->
    <g transform="translate(0, 0)">
      <svg class="icon" viewBox="0 0 16 16" width="15" height="15" y="4">
        <path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
      </svg>
      <text x="24" y="16" class="stat">Contribuciones (2026):</text>
      <text x="224" y="16" class="bold-amber">288</text>
    </g>

    <!-- Row 2: Total Commits -->
    <g transform="translate(0, 26)">
      <svg class="icon" viewBox="0 0 16 16" width="15" height="15" y="4">
        <path fill-rule="evenodd" d="M1.643 3.143L.427 1.927A.25.25 0 000 2.104V5.75c0 .138.112.25.25.25h3.646a.25.25 0 00.177-.427L2.715 4.215a6.5 6.5 0 11-1.18 4.458.75.75 0 10-1.493.154 8.001 8.001 0 101.6-5.684zM7.75 4a.75.75 0 01.75.75v2.992l2.028.812a.75.75 0 01-.557 1.392l-2.5-1A.75.75 0 017 8.25v-3.5A.75.75 0 017.75 4z"/>
      </svg>
      <text x="24" y="16" class="stat">Total Commits (2026):</text>
      <text x="224" y="16" class="bold">210+</text>
    </g>

    <!-- Row 3: Total PRs -->
    <g transform="translate(0, 52)">
      <svg class="icon" viewBox="0 0 16 16" width="15" height="15" y="4">
        <path fill-rule="evenodd" d="M7.177 3.073L9.573.677A.25.25 0 0110 .854v4.792a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/>
      </svg>
      <text x="24" y="16" class="stat">Pull Requests &amp; Merges:</text>
      <text x="224" y="16" class="bold">7</text>
    </g>

    <!-- Row 4: Repositories -->
    <g transform="translate(0, 78)">
      <svg class="icon" viewBox="0 0 16 16" width="15" height="15" y="4">
        <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
      </svg>
      <text x="24" y="16" class="stat">Repositorios Activos:</text>
      <text x="224" y="16" class="bold">16</text>
    </g>

    <!-- Row 5: Private Repos -->
    <g transform="translate(0, 104)">
      <svg class="icon" viewBox="0 0 16 16" width="15" height="15" y="4">
        <path fill-rule="evenodd" d="M4.75 0a.75.75 0 01.75.75V2h5V.75a.75.75 0 011.5 0V2h1.25c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0113.25 16H2.75A1.75 1.75 0 011 14.25V3.75C1 2.784 1.784 2 2.75 2H4V.75A.75.75 0 014.75 0zm0 3.5h8.5a.25.25 0 01.25.25V6h-11V3.75a.25.25 0 01.25-.25h2zm-2.25 4v6.75c0 .138.112.25.25.25h10.5a.25.25 0 00.25-.25V7.5h-11z"/>
      </svg>
      <text x="24" y="16" class="stat">Incluye Repos Privados:</text>
      <text x="224" y="16" class="bold">Sí (100%)</text>
    </g>
  </g>

  <!-- Black Hole Rank Singularity Orb -->
  <g transform="translate(396, 118)">
    <circle cx="0" cy="0" r="68" fill="url(#rankAura)"/>
    <ellipse cx="0" cy="0" rx="64" ry="18" stroke="#fb8500" stroke-width="1.8" fill="none" transform="rotate(-16)" opacity="0.6"/>
    <circle cx="0" cy="0" r="44" stroke="#1e1b4b" stroke-width="6" fill="#000000"/>
    <circle cx="0" cy="0" r="44" stroke="url(#rankRing)" stroke-width="5" stroke-dasharray="235 41" stroke-linecap="round" fill="none" transform="rotate(-90)"/>
    <circle class="spin-ring" cx="0" cy="0" r="52" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="18 28 6 22" fill="none" opacity="0.65"/>
    <text x="0" y="5" text-anchor="middle" class="rank-text">A+</text>
    <text x="0" y="23" text-anchor="middle" class="rank-sub">TOP</text>
  </g>
</svg>
