<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="langsTitle">
  <title id="langsTitle">Lenguajes más usados de Andres (Pandxk)</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ff79c6; }
    .lang-name { font: 600 12.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8f8f2; }
    .lang-pct { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #bd93f9; }
  </style>
  <rect x="0.5" y="0.5" rx="10" height="99%" width="494" fill="#282a36" stroke="#44475a" stroke-opacity="0.6"/>

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Lenguajes Más Usados (Públicos + Privados)</text>
  </g>

  <!-- Multi-color Progress Bar -->
  <g transform="translate(25, 55)">
    <clipPath id="barClip">
      <rect x="0" y="0" width="445" height="12" rx="6"/>
    </clipPath>
    <g clip-path="url(#barClip)">
      <!-- TypeScript: 28% (124.6px) -->
      <rect x="0" y="0" width="125" height="12" fill="#3178c6"/>
      <!-- JavaScript: 26% (115.7px) -->
      <rect x="125" y="0" width="116" height="12" fill="#f1e05a"/>
      <!-- Java: 24% (106.8px) -->
      <rect x="241" y="0" width="107" height="12" fill="#b07219"/>
      <!-- HTML5 & CSS3/SCSS: 13% (57.8px) -->
      <rect x="348" y="0" width="58" height="12" fill="#e34c26"/>
      <!-- Python: 9% (40px) -->
      <rect x="406" y="0" width="39" height="12" fill="#3572A5"/>
    </g>
  </g>

  <!-- Language Legend Columns -->
  <g transform="translate(25, 92)">
    <!-- Col 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="-4" r="5" fill="#3178c6"/>
      <text x="18" y="0" class="lang-name">TypeScript</text>
      <text x="105" y="0" class="lang-pct">28.0%</text>
    </g>
    <g transform="translate(0, 28)">
      <circle cx="6" cy="-4" r="5" fill="#b07219"/>
      <text x="18" y="0" class="lang-name">Java</text>
      <text x="105" y="0" class="lang-pct">24.0%</text>
    </g>
    <g transform="translate(0, 56)">
      <circle cx="6" cy="-4" r="5" fill="#3572A5"/>
      <text x="18" y="0" class="lang-name">Python</text>
      <text x="105" y="0" class="lang-pct">9.0%</text>
    </g>

    <!-- Col 2 -->
    <g transform="translate(230, 0)">
      <circle cx="6" cy="-4" r="5" fill="#f1e05a"/>
      <text x="18" y="0" class="lang-name">JavaScript</text>
      <text x="135" y="0" class="lang-pct">26.0%</text>
    </g>
    <g transform="translate(230, 28)">
      <circle cx="6" cy="-4" r="5" fill="#e34c26"/>
      <text x="18" y="0" class="lang-name">HTML5 / CSS3 / SCSS</text>
      <text x="155" y="0" class="lang-pct">13.0%</text>
    </g>
    <g transform="translate(230, 56)">
      <circle cx="6" cy="-4" r="5" fill="#50fa7b"/>
      <text x="18" y="0" class="lang-name">SQL / T-SQL / Shell</text>
      <text x="155" y="0" class="lang-pct">Activo</text>
    </g>
  </g>
</svg>
