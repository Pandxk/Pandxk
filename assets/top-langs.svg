<svg width="495" height="215" viewBox="0 0 495 215" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="langsTitle">
  <title id="langsTitle">Espectro de Lenguajes de Andres (Pandxk)</title>
  <defs>
    <linearGradient id="lBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050411"/>
      <stop offset="55%" stop-color="#0a061c"/>
      <stop offset="100%" stop-color="#040917"/>
    </linearGradient>
    <linearGradient id="lBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f72585" stop-opacity="0.75"/>
    </linearGradient>
    <style>
      .sub { font: 600 10.5px 'Cascadia Code', 'Fira Code', ui-monospace, monospace; fill: #38bdf8; letter-spacing: 1px; }
      .header { font: 700 17px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .lang-name { font: 600 12.5px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #e2e8f0; }
      .lang-pct { font: 600 12px 'Cascadia Code', 'Fira Code', ui-monospace, monospace; fill: #c77dff; }
      .lang-act { font: 600 12px 'Cascadia Code', 'Fira Code', ui-monospace, monospace; fill: #38bdf8; }
    </style>
  </defs>

  <rect x="1" y="1" rx="14" height="213" width="493" fill="url(#lBg)" stroke="url(#lBorder)" stroke-width="1.5"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="445" cy="26" r="1.2"/><circle cx="380" cy="36" r="1"/><circle cx="462" cy="186" r="1.1"/>
    <circle cx="24" cy="188" r="1"/>
  </g>

  <g transform="translate(24, 30)">
    <text x="0" y="0" class="sub">ESPECTRO ESTELAR</text>
    <text x="0" y="22" class="header">Lenguajes Más Usados (Públicos + Privados)</text>
  </g>

  <!-- Multi-color Progress Bar -->
  <g transform="translate(24, 72)">
    <rect x="-1" y="-1" width="449" height="14" rx="7" fill="#0d0921" stroke="#9d4edd" stroke-opacity="0.35"/>
    <clipPath id="barClip">
      <rect x="0" y="0" width="447" height="12" rx="6"/>
    </clipPath>
    <g clip-path="url(#barClip)">
      <!-- TypeScript: 28% -->
      <rect x="0" y="0" width="125" height="12" fill="#3178c6"/>
      <!-- JavaScript: 26% -->
      <rect x="125" y="0" width="116" height="12" fill="#f1e05a"/>
      <!-- Java: 24% -->
      <rect x="241" y="0" width="107" height="12" fill="#fb8500"/>
      <!-- HTML5 & CSS3/SCSS: 13% -->
      <rect x="348" y="0" width="58" height="12" fill="#f72585"/>
      <!-- Python: 9% -->
      <rect x="406" y="0" width="41" height="12" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Language Legend Columns -->
  <g transform="translate(24, 114)">
    <!-- Col 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="-4" r="5" fill="#3178c6"/>
      <text x="18" y="0" class="lang-name">TypeScript</text>
      <text x="115" y="0" class="lang-pct">28.0%</text>
    </g>
    <g transform="translate(0, 29)">
      <circle cx="6" cy="-4" r="5" fill="#fb8500"/>
      <text x="18" y="0" class="lang-name">Java</text>
      <text x="115" y="0" class="lang-pct">24.0%</text>
    </g>
    <g transform="translate(0, 58)">
      <circle cx="6" cy="-4" r="5" fill="#38bdf8"/>
      <text x="18" y="0" class="lang-name">Python</text>
      <text x="115" y="0" class="lang-pct">9.0%</text>
    </g>

    <!-- Col 2 -->
    <g transform="translate(222, 0)">
      <circle cx="6" cy="-4" r="5" fill="#f1e05a"/>
      <text x="18" y="0" class="lang-name">JavaScript</text>
      <text x="168" y="0" class="lang-pct">26.0%</text>
    </g>
    <g transform="translate(222, 29)">
      <circle cx="6" cy="-4" r="5" fill="#f72585"/>
      <text x="18" y="0" class="lang-name">HTML5 / CSS3 / SCSS</text>
      <text x="168" y="0" class="lang-pct">13.0%</text>
    </g>
    <g transform="translate(222, 58)">
      <circle cx="6" cy="-4" r="5" fill="#50fa7b"/>
      <text x="18" y="0" class="lang-name">SQL / T-SQL / Shell</text>
      <text x="168" y="0" class="lang-act">Activo</text>
    </g>
  </g>
</svg>
