<svg width="1200" height="110" viewBox="0 0 1200 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer Galaxia Pandxk">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04030c"/>
      <stop offset="50%" stop-color="#0a061e"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
    <linearGradient id="fBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#fb8500" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="horizonWave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0"/>
      <stop offset="25%" stop-color="#f72585" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffb703" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.7"/>
