  <rect x="1" y="1" width="1198" height="108" rx="16" fill="url(#fBg)" stroke="url(#fBorder)" stroke-width="1.4"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="85" cy="28" r="1.1"/><circle cx="195" cy="76" r="1.2"/><circle cx="310" cy="34" r="1"/>
    <circle cx="440" cy="24" r="1.3"/><circle cx="760" cy="26" r="1.2"/><circle cx="890" cy="74" r="1.1"/>
    <circle cx="1015" cy="32" r="1.3"/><circle cx="1115" cy="68" r="1"/>
  </g>

  <!-- Gravitational Horizon Arc -->
  <path d="M 60 84 Q 600 32 1140 84" stroke="url(#horizonWave)" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 140 94 Q 600 54 1060 94" stroke="url(#horizonWave)" stroke-width="1" fill="none" opacity="0.4"/>

  <text x="600" y="42" text-anchor="middle" class="f-main">✦ Gracias por explorar mi órbita de código ✦</text>
